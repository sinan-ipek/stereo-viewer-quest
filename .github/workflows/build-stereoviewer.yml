name: StereoViewer Quest APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Bos proje klasorunu hazirla
        shell: bash
        run: |
          rm -rf StereoViewer
          mkdir -p StereoViewer/build

      - name: StereoViewer v0.5.3 grip ile yatay tasima kaynaklarini yaz
        shell: bash
        run: |
          cat > StereoViewer/project.godot <<'EOF'
          [application]
          config/name="StereoViewer"
          config/description="Meta Quest icin SBS 3B fotograf goruntuleyici"
          config/version="0.5.3"
          config/icon="res://icon.svg"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.6", "GL Compatibility")

          [display]
          window/size/viewport_width=1832
          window/size/viewport_height=1920
          window/handheld/orientation=0

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/vram_compression/import_etc2_astc=true
          anti_aliasing/quality/msaa_3d=0
          xr/openxr/enabled=true

          [xr]
          openxr/enabled=true
          EOF

          cat > StereoViewer/icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#10182f"/>
                <stop offset="1" stop-color="#3567d6"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="104" fill="url(#bg)"/>
            <path d="M84 256c44-72 101-108 172-108s128 36 172 108c-44 72-101 108-172 108S128 328 84 256Z" fill="none" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
            <circle cx="256" cy="256" r="68" fill="#57d9ff"/>
            <circle cx="256" cy="256" r="28" fill="#10182f"/>
          </svg>
          EOF

          cat > StereoViewer/stereo.gdshader <<'EOF'
          shader_type spatial;
          render_mode unshaded, cull_disabled;

          uniform sampler2D stereo_photo : source_color, repeat_disable, filter_linear;
          uniform bool swap_eyes = false;

          void fragment() {
              float eye = float(VIEW_INDEX);
              if (swap_eyes) {
                  eye = 1.0 - eye;
              }
              vec2 stereo_uv = vec2(UV.x * 0.5 + eye * 0.5, UV.y);
              ALBEDO = texture(stereo_photo, stereo_uv).rgb;
          }
          EOF

          cat > StereoViewer/thumbnail.gdshader <<'EOF'
          shader_type spatial;
          render_mode unshaded, cull_disabled;

          uniform sampler2D thumbnail_photo : source_color, repeat_disable, filter_linear;

          void fragment() {
              // Secim ekraninda her iki goze de SBS fotografin sol karesini goster.
              // Boylece kucuk onizleme tek, normal bir fotograf gibi gorunur.
              vec2 thumbnail_uv = vec2(UV.x * 0.5, UV.y);
              ALBEDO = texture(thumbnail_photo, thumbnail_uv).rgb;
          }
          EOF


          cat > StereoViewer/Main.tscn <<'EOF'
          [gd_scene load_steps=11 format=3]

          [ext_resource path="res://viewer.gd" type="Script" id="1"]
          [ext_resource path="res://stereo.gdshader" type="Shader" id="2"]
          [ext_resource path="res://thumbnail.gdshader" type="Shader" id="3"]

          [sub_resource type="ShaderMaterial" id="StereoMaterial"]
          shader = ExtResource("2")

          [sub_resource type="QuadMesh" id="PhotoMesh"]
          material = SubResource("StereoMaterial")
          size = Vector2(1.6, 1.8)

          [sub_resource type="ShaderMaterial" id="ThumbMaterial"]
          shader = ExtResource("3")

          [sub_resource type="QuadMesh" id="ThumbMesh"]
          material = SubResource("ThumbMaterial")
          size = Vector2(0.72, 0.82)

          [sub_resource type="StandardMaterial3D" id="BorderMaterial"]
          shading_mode = 0
          albedo_color = Color(0.12, 0.2, 0.38, 1)

          [sub_resource type="QuadMesh" id="BorderMesh"]
          material = SubResource("BorderMaterial")
          size = Vector2(0.82, 0.92)

          [sub_resource type="StandardMaterial3D" id="PanelMaterial"]
          shading_mode = 0
          albedo_color = Color(0.025, 0.04, 0.085, 0.98)

          [sub_resource type="QuadMesh" id="PanelMesh"]
          material = SubResource("PanelMaterial")
          size = Vector2(3.35, 1.75)

          [sub_resource type="Environment" id="Environment"]
          background_mode = 1
          background_color = Color(0.008, 0.012, 0.025, 1)
          ambient_light_source = 3
          ambient_light_color = Color(0.15, 0.18, 0.28, 1)
          ambient_light_energy = 0.35

          [node name="Main" type="Node3D"]
          script = ExtResource("1")

          [node name="WorldEnvironment" type="WorldEnvironment" parent="."]
          environment = SubResource("Environment")

          [node name="XROrigin3D" type="XROrigin3D" parent="."]

          [node name="XRCamera3D" type="XRCamera3D" parent="XROrigin3D"]

          [node name="Display" type="Node3D" parent="XROrigin3D"]
          position = Vector3(0, 1.55, -2.1)

          [node name="Photo" type="MeshInstance3D" parent="XROrigin3D/Display"]
          visible = false
          mesh = SubResource("PhotoMesh")

          [node name="InfoPanel" type="Node3D" parent="XROrigin3D/Display"]

          [node name="Background" type="MeshInstance3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0, -0.015)
          mesh = SubResource("PanelMesh")

          [node name="Title" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0.48, 0)
          pixel_size = 0.0025
          font_size = 44
          outline_size = 7
          text = "StereoViewer"

          [node name="Message" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0.02, 0)
          pixel_size = 0.0025
          font_size = 27
          outline_size = 6
          text = "v0.5.3 - build 26\n\nQuest fotoğraflarınızı açmaya hazır."

          [node name="Help" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, -0.55, 0)
          pixel_size = 0.0025
          font_size = 22
          outline_size = 5
          modulate = Color(0.62, 0.82, 1, 1)
          text = "A: fotoğraf galerisi"

          [node name="Selector" type="Node3D" parent="XROrigin3D/Display"]
          visible = false

          [node name="Background" type="MeshInstance3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(0, 0, -0.035)
          mesh = SubResource("PanelMesh")

          [node name="Title" type="Label3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(0, 0.69, 0)
          pixel_size = 0.0025
          font_size = 29
          outline_size = 6
          text = "Quest fotoğrafları"

          [node name="Border1" type="MeshInstance3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(-1.08, 0.08, -0.012)
          mesh = SubResource("BorderMesh")

          [node name="Thumb1" type="MeshInstance3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(-1.08, 0.08, 0)
          mesh = SubResource("ThumbMesh")

          [node name="Name1" type="Label3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(-1.08, -0.45, 0.01)
          pixel_size = 0.0025
          font_size = 16
          outline_size = 4
          text = "-"

          [node name="Border2" type="MeshInstance3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(0, 0.08, -0.012)
          mesh = SubResource("BorderMesh")

          [node name="Thumb2" type="MeshInstance3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(0, 0.08, 0)
          mesh = SubResource("ThumbMesh")

          [node name="Name2" type="Label3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(0, -0.45, 0.01)
          pixel_size = 0.0025
          font_size = 16
          outline_size = 4
          text = "-"

          [node name="Border3" type="MeshInstance3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(1.08, 0.08, -0.012)
          mesh = SubResource("BorderMesh")

          [node name="Thumb3" type="MeshInstance3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(1.08, 0.08, 0)
          mesh = SubResource("ThumbMesh")

          [node name="Name3" type="Label3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(1.08, -0.45, 0.01)
          pixel_size = 0.0025
          font_size = 16
          outline_size = 4
          text = "-"

          [node name="Cursor" type="Label3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(0, -0.69, 0.01)
          pixel_size = 0.0025
          font_size = 19
          outline_size = 5
          modulate = Color(0.25, 0.92, 1, 1)
          text = "1 / 1"

          [node name="Status" type="Label3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(0, 0.48, 0.01)
          pixel_size = 0.0025
          font_size = 18
          outline_size = 5
          modulate = Color(0.78, 0.88, 1, 1)
          text = ""

          [node name="Help" type="Label3D" parent="XROrigin3D/Display/Selector"]
          position = Vector3(0, -0.84, 0)
          pixel_size = 0.0025
          font_size = 19
          outline_size = 5
          modulate = Color(0.62, 0.82, 1, 1)
          text = "Çubuk sağ/sol: seç     A: aç     B: geri"

          [node name="LeftController" type="XRController3D" parent="XROrigin3D"]
          tracker = &"left_hand"

          [node name="RightController" type="XRController3D" parent="XROrigin3D"]
          tracker = &"right_hand"

          [node name="FallbackCamera" type="Camera3D" parent="."]
          current = false
          EOF
          # v0.5.3, calisan stereo, galeri ve Quest Touch temelini korur.
          # Sag grip basili tutulurken fotograf penceresi yalnizca yatay tasinir.
          # Quest'in Pictures, DCIM ve Download klasorleri arka planda taranir.
          cat > StereoViewer/viewer.gd <<'EOF'
          extends Node3D

          enum ViewMode {
              HOME,
              LOADING,
              GALLERY,
              PHOTO
          }

          const BUILD_TEXT := "v0.5.3 - build 26"
          const PERMISSION_IMAGES := "android.permission.READ_MEDIA_IMAGES"
          const PERMISSION_VISUAL_SELECTED := "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
          const PERMISSION_LEGACY := "android.permission.READ_EXTERNAL_STORAGE"
          const MIN_DISTANCE := 0.85
          const MAX_DISTANCE := 4.50
          const DISTANCE_SPEED := 1.25
          const GRIP_PRESS_THRESHOLD := 0.55
          const GRIP_RELEASE_THRESHOLD := 0.35
          const MAX_HORIZONTAL_OFFSET := 1.50
          const STICK_TRIGGER := 0.62
          const STICK_RELEASE := 0.24
          const PHOTO_HEIGHT := 1.80
          const THUMB_HEIGHT := 0.82
          const THUMB_MAX_PIXELS := 512
          const MAX_PHOTOS := 1500
          const MAX_SCAN_DEPTH := 8
          const SUPPORTED_EXTENSIONS := ["jpg", "jpeg", "png", "webp", "jps"]
          const COLOR_SELECTED := Color(0.12, 0.78, 1.0, 1.0)
          const COLOR_NORMAL := Color(0.12, 0.20, 0.38, 1.0)

          @onready var xr_camera: XRCamera3D = $XROrigin3D/XRCamera3D
          @onready var display: Node3D = $XROrigin3D/Display
          @onready var photo: MeshInstance3D = $XROrigin3D/Display/Photo
          @onready var info_panel: Node3D = $XROrigin3D/Display/InfoPanel
          @onready var info_message: Label3D = $XROrigin3D/Display/InfoPanel/Message
          @onready var info_help: Label3D = $XROrigin3D/Display/InfoPanel/Help
          @onready var selector: Node3D = $XROrigin3D/Display/Selector
          @onready var selector_cursor: Label3D = $XROrigin3D/Display/Selector/Cursor
          @onready var selector_status: Label3D = $XROrigin3D/Display/Selector/Status
          @onready var right_controller: XRController3D = $XROrigin3D/RightController
          @onready var fallback_camera: Camera3D = $FallbackCamera

          var xr_ready := false
          var mode := ViewMode.HOME
          var photo_paths: Array[String] = []
          var current_index := 0
          var viewing_distance := 2.10
          var horizontal_offset := 0.0
          var grip_dragging := false
          var grip_start_controller_position := Vector3.ZERO
          var grip_start_display_offset := 0.0
          var grip_drag_axis := Vector3.RIGHT
          var swap_eyes := false
          var horizontal_latched := false
          var library_scanned := false
          var permission_waiting := false
          var permission_check_scheduled := false
          var scan_running := false
          var scan_thread: Thread
          var scan_roots: Array[String] = []
          var gallery_generation := 0
          var thumbnail_queue: Array[Dictionary] = []
          var photo_material: ShaderMaterial
          var photo_mesh: QuadMesh
          var current_texture: Texture2D
          var placeholder_texture: Texture2D
          var thumb_nodes: Array[MeshInstance3D] = []
          var thumb_materials: Array[ShaderMaterial] = []
          var thumb_meshes: Array[QuadMesh] = []
          var border_nodes: Array[MeshInstance3D] = []
          var border_materials: Array[StandardMaterial3D] = []
          var name_labels: Array[Label3D] = []

          func _ready() -> void:
              process_mode = Node.PROCESS_MODE_ALWAYS
              prepare_nodes_and_materials()
              right_controller.button_pressed.connect(_on_right_button_pressed)
              get_tree().on_request_permissions_result.connect(_on_permission_result)
              attach_display_to_camera()
              show_home()
              initialize_xr()

          func prepare_nodes_and_materials() -> void:
              photo_material = photo.get_active_material(0).duplicate() as ShaderMaterial
              photo.material_override = photo_material
              photo_mesh = photo.mesh.duplicate() as QuadMesh
              photo.mesh = photo_mesh

              thumb_nodes = [
                  $XROrigin3D/Display/Selector/Thumb1,
                  $XROrigin3D/Display/Selector/Thumb2,
                  $XROrigin3D/Display/Selector/Thumb3
              ]
              border_nodes = [
                  $XROrigin3D/Display/Selector/Border1,
                  $XROrigin3D/Display/Selector/Border2,
                  $XROrigin3D/Display/Selector/Border3
              ]
              name_labels = [
                  $XROrigin3D/Display/Selector/Name1,
                  $XROrigin3D/Display/Selector/Name2,
                  $XROrigin3D/Display/Selector/Name3
              ]

              placeholder_texture = create_placeholder_texture()
              for slot in range(3):
                  var thumb_material := thumb_nodes[slot].get_active_material(0).duplicate() as ShaderMaterial
                  var thumb_mesh := thumb_nodes[slot].mesh.duplicate() as QuadMesh
                  var border_material := border_nodes[slot].get_active_material(0).duplicate() as StandardMaterial3D
                  thumb_nodes[slot].mesh = thumb_mesh
                  thumb_nodes[slot].material_override = thumb_material
                  border_nodes[slot].material_override = border_material
                  thumb_material.set_shader_parameter("thumbnail_photo", placeholder_texture)
                  thumb_materials.append(thumb_material)
                  thumb_meshes.append(thumb_mesh)
                  border_materials.append(border_material)

          func create_placeholder_texture() -> Texture2D:
              var image := Image.create(16, 16, false, Image.FORMAT_RGBA8)
              image.fill(Color(0.045, 0.07, 0.13, 1.0))
              return ImageTexture.create_from_image(image)

          func initialize_xr() -> void:
              var xr_interface := XRServer.find_interface("OpenXR")
              if xr_interface != null and xr_interface.is_initialized():
                  DisplayServer.window_set_vsync_mode(DisplayServer.VSYNC_DISABLED)
                  get_viewport().use_xr = true
                  xr_ready = true
                  return

              fallback_camera.current = true
              xr_ready = false
              info_message.text = BUILD_TEXT + "\n\nOpenXR BAŞLATILAMADI"

          func attach_display_to_camera() -> void:
              display.reparent(xr_camera, false)
              display.rotation = Vector3.ZERO
              update_display_distance()

          func update_display_distance() -> void:
              display.position = Vector3(horizontal_offset, 0.0, -viewing_distance)

          func _on_right_button_pressed(action_name: StringName) -> void:
              match action_name:
                  &"ax_button":
                      handle_a_button()
                  &"by_button":
                      handle_b_button()

          func handle_a_button() -> void:
              match mode:
                  ViewMode.HOME:
                      if library_scanned and not photo_paths.is_empty():
                          open_gallery()
                      else:
                          begin_library_access()
                  ViewMode.GALLERY:
                      open_photo(current_index)
                  ViewMode.PHOTO:
                      open_gallery()

          func handle_b_button() -> void:
              match mode:
                  ViewMode.GALLERY:
                      show_home()
                  ViewMode.PHOTO:
                      swap_eyes = not swap_eyes
                      photo_material.set_shader_parameter("swap_eyes", swap_eyes)

          func _process(delta: float) -> void:
              finish_scan_if_ready()
              process_one_thumbnail()

              if not xr_ready:
                  return

              process_grip_drag()

              var stick := right_controller.get_vector2(&"primary")
              if abs(stick.x) >= STICK_TRIGGER and not horizontal_latched:
                  horizontal_latched = true
                  handle_horizontal(1 if stick.x > 0.0 else -1)
              elif abs(stick.x) <= STICK_RELEASE:
                  horizontal_latched = false

              if mode == ViewMode.PHOTO and abs(stick.y) > 0.20 and abs(stick.y) > abs(stick.x):
                  viewing_distance = clampf(
                      viewing_distance - stick.y * DISTANCE_SPEED * delta,
                      MIN_DISTANCE,
                      MAX_DISTANCE
                  )
                  update_display_distance()

          func process_grip_drag() -> void:
              if mode != ViewMode.PHOTO:
                  grip_dragging = false
                  return

              apply_grip_drag(
                  right_controller.get_float(&"grip"),
                  right_controller.global_position
              )

          func apply_grip_drag(grip_value: float, controller_position: Vector3) -> void:
              if not grip_dragging:
                  if grip_value >= GRIP_PRESS_THRESHOLD:
                      grip_dragging = true
                      grip_start_controller_position = controller_position
                      grip_start_display_offset = horizontal_offset
                      grip_drag_axis = xr_camera.global_transform.basis.x.normalized()
                  return

              if grip_value <= GRIP_RELEASE_THRESHOLD:
                  grip_dragging = false
                  return

              var controller_delta := (
                  controller_position - grip_start_controller_position
              )
              horizontal_offset = clampf(
                  grip_start_display_offset + controller_delta.dot(grip_drag_axis),
                  -MAX_HORIZONTAL_OFFSET,
                  MAX_HORIZONTAL_OFFSET
              )
              update_display_distance()

          func handle_horizontal(direction: int) -> void:
              if photo_paths.is_empty():
                  return

              match mode:
                  ViewMode.GALLERY:
                      current_index = wrapi(current_index + direction, 0, photo_paths.size())
                      refresh_gallery()
                  ViewMode.PHOTO:
                      current_index = wrapi(current_index + direction, 0, photo_paths.size())
                      apply_current_photo()

          func show_home() -> void:
              mode = ViewMode.HOME
              photo.visible = false
              selector.visible = false
              info_panel.visible = true
              info_message.text = BUILD_TEXT + "\n\nQuest fotoğraflarınızı açmaya hazır."
              info_help.text = "A: fotoğraf galerisi"

          func show_loading(message: String) -> void:
              mode = ViewMode.LOADING
              photo.visible = false
              selector.visible = false
              info_panel.visible = true
              info_message.text = BUILD_TEXT + "\n\n" + message
              info_help.text = "Lütfen bekleyin"

          func show_library_message(message: String, help_text: String) -> void:
              mode = ViewMode.HOME
              photo.visible = false
              selector.visible = false
              info_panel.visible = true
              info_message.text = BUILD_TEXT + "\n\n" + message
              info_help.text = help_text

          func begin_library_access() -> void:
              if scan_running or permission_waiting:
                  return

              if OS.get_name() != "Android" or has_media_permission():
                  start_library_scan()
                  return

              permission_waiting = true
              show_loading("Fotoğraf erişim izni bekleniyor...")
              var permission := PERMISSION_IMAGES if get_android_sdk() >= 33 else PERMISSION_LEGACY
              if OS.request_permission(permission):
                  permission_waiting = false
                  start_library_scan()

          func get_android_sdk() -> int:
              if OS.get_name() != "Android":
                  return 0
              var wrapper = Engine.get_singleton("JavaClassWrapper")
              if wrapper == null:
                  return 33
              var version_class = wrapper.wrap("android.os.Build$VERSION")
              return int(version_class.SDK_INT)

          func has_media_permission() -> bool:
              if OS.get_name() != "Android":
                  return true
              var granted := OS.get_granted_permissions()
              return (
                  granted.has(PERMISSION_IMAGES)
                  or granted.has(PERMISSION_VISUAL_SELECTED)
                  or granted.has(PERMISSION_LEGACY)
              )

          func _on_permission_result(permission: String, _granted: bool) -> void:
              if not permission_waiting:
                  return
              if permission in [PERMISSION_IMAGES, PERMISSION_VISUAL_SELECTED, PERMISSION_LEGACY]:
                  schedule_permission_check()

          func _notification(what: int) -> void:
              if what == NOTIFICATION_APPLICATION_RESUMED and permission_waiting:
                  schedule_permission_check()

          func schedule_permission_check() -> void:
              if permission_check_scheduled:
                  return
              permission_check_scheduled = true
              await get_tree().create_timer(0.45).timeout
              permission_check_scheduled = false
              if not permission_waiting:
                  return
              permission_waiting = false
              if has_media_permission():
                  start_library_scan()
              else:
                  show_library_message(
                      "Fotoğraf erişim izni verilmedi.",
                      "A: yeniden izin iste"
                  )

          func start_library_scan() -> void:
              if scan_running:
                  return

              scan_roots.clear()
              add_scan_root(OS.get_system_dir(OS.SYSTEM_DIR_PICTURES, true))
              add_scan_root(OS.get_system_dir(OS.SYSTEM_DIR_DCIM, true))
              add_scan_root(OS.get_system_dir(OS.SYSTEM_DIR_DOWNLOADS, true))

              show_loading("Pictures, DCIM ve Download taranıyor...")
              scan_thread = Thread.new()
              scan_running = true
              var start_error := scan_thread.start(_scan_library_worker)
              if start_error != OK:
                  scan_running = false
                  show_library_message(
                      "Fotoğraf taraması başlatılamadı.",
                      "A: yeniden dene"
                  )

          func add_scan_root(path: String) -> void:
              if not path.is_empty() and not scan_roots.has(path):
                  scan_roots.append(path)

          func _scan_library_worker() -> Array[String]:
              var found: Array[String] = []
              var seen := {}
              for root in scan_roots:
                  collect_images(root, 0, found, seen)
                  if found.size() >= MAX_PHOTOS:
                      break
              found.sort_custom(_newer_file_first)
              if found.size() > MAX_PHOTOS:
                  found.resize(MAX_PHOTOS)
              return found

          func collect_images(path: String, depth: int, found: Array[String], seen: Dictionary) -> void:
              if depth > MAX_SCAN_DEPTH or found.size() >= MAX_PHOTOS:
                  return
              var directory := DirAccess.open(path)
              if directory == null:
                  return
              directory.list_dir_begin()
              var item := directory.get_next()
              while not item.is_empty() and found.size() < MAX_PHOTOS:
                  if item != "." and item != ".." and not item.begins_with("."):
                      var full_path := path.path_join(item)
                      if directory.current_is_dir():
                          collect_images(full_path, depth + 1, found, seen)
                      else:
                          var extension := item.get_extension().to_lower()
                          if extension in SUPPORTED_EXTENSIONS and not seen.has(full_path):
                              var probe := FileAccess.open(full_path, FileAccess.READ)
                              if probe != null:
                                  probe = null
                                  seen[full_path] = true
                                  found.append(full_path)
                  item = directory.get_next()
              directory.list_dir_end()

          func _newer_file_first(a: String, b: String) -> bool:
              return FileAccess.get_modified_time(a) > FileAccess.get_modified_time(b)

          func finish_scan_if_ready() -> void:
              if not scan_running or scan_thread == null or scan_thread.is_alive():
                  return
              var result = scan_thread.wait_to_finish()
              scan_running = false
              library_scanned = true
              photo_paths.clear()
              if result is Array:
                  for path in result:
                      photo_paths.append(String(path))

              if photo_paths.is_empty():
                  show_library_message(
                      "Uygun SBS fotoğraf bulunamadı.\nPictures, DCIM veya Download klasörüne\nJPG, PNG, WebP ya da JPS dosyası ekleyin.",
                      "A: yeniden tara"
                  )
                  return

              current_index = clampi(current_index, 0, photo_paths.size() - 1)
              open_gallery()

          func open_gallery() -> void:
              if photo_paths.is_empty():
                  begin_library_access()
                  return
              mode = ViewMode.GALLERY
              photo.visible = false
              info_panel.visible = false
              selector.visible = true
              refresh_gallery()

          func refresh_gallery() -> void:
              gallery_generation += 1
              thumbnail_queue.clear()
              selector_cursor.text = str(current_index + 1) + " / " + str(photo_paths.size())
              selector_status.text = "Önizlemeler hazırlanıyor..."

              var indices := [
                  wrapi(current_index - 1, 0, photo_paths.size()),
                  current_index,
                  wrapi(current_index + 1, 0, photo_paths.size())
              ]
              var load_order := [1, 0, 2]

              for slot in range(3):
                  thumb_materials[slot].set_shader_parameter("thumbnail_photo", placeholder_texture)
                  thumb_meshes[slot].size = Vector2(THUMB_HEIGHT * 0.88, THUMB_HEIGHT)
                  border_materials[slot].albedo_color = COLOR_SELECTED if slot == 1 else COLOR_NORMAL
                  name_labels[slot].text = short_file_name(photo_paths[indices[slot]])

              for slot in load_order:
                  thumbnail_queue.append({
                      "generation": gallery_generation,
                      "slot": slot,
                      "path": photo_paths[indices[slot]]
                  })

          func process_one_thumbnail() -> void:
              if mode != ViewMode.GALLERY or thumbnail_queue.is_empty():
                  return
              var job: Dictionary = thumbnail_queue.pop_front()
              if int(job["generation"]) != gallery_generation:
                  return

              var slot := int(job["slot"])
              var texture := load_texture_from_path(String(job["path"]), true)
              if texture != null:
                  thumb_materials[slot].set_shader_parameter("thumbnail_photo", texture)
                  var eye_aspect := (float(texture.get_width()) * 0.5) / maxf(1.0, float(texture.get_height()))
                  thumb_meshes[slot].size = Vector2(
                      THUMB_HEIGHT * clampf(eye_aspect, 0.55, 1.18),
                      THUMB_HEIGHT
                  )

              if thumbnail_queue.is_empty():
                  selector_status.text = ""

          func short_file_name(path: String) -> String:
              var file_name := path.get_file().get_basename()
              if file_name.length() > 22:
                  return file_name.left(19) + "..."
              return file_name

          func open_photo(index: int) -> void:
              current_index = clampi(index, 0, photo_paths.size() - 1)
              if not apply_current_photo():
                  selector_status.text = "Bu fotoğraf açılamadı"
                  return
              mode = ViewMode.PHOTO
              info_panel.visible = false
              selector.visible = false
              photo.visible = true

          func apply_current_photo() -> bool:
              if photo_paths.is_empty():
                  return false
              var loaded_texture := load_texture_from_path(photo_paths[current_index], false)
              if loaded_texture == null:
                  return false

              current_texture = loaded_texture
              photo_material.set_shader_parameter("stereo_photo", current_texture)
              photo_material.set_shader_parameter("swap_eyes", swap_eyes)
              var eye_aspect := (float(current_texture.get_width()) * 0.5) / maxf(1.0, float(current_texture.get_height()))
              photo_mesh.size = Vector2(PHOTO_HEIGHT * eye_aspect, PHOTO_HEIGHT)
              return true

          func load_texture_from_path(path: String, thumbnail: bool) -> Texture2D:
              var image := Image.new()
              var error := ERR_FILE_UNRECOGNIZED
              if path.get_extension().to_lower() == "jps":
                  var file := FileAccess.open(path, FileAccess.READ)
                  if file != null:
                      error = image.load_jpg_from_buffer(file.get_buffer(file.get_length()))
              else:
                  error = image.load(path)
              if error != OK or image.is_empty():
                  return null

              if thumbnail:
                  var largest_dimension := maxi(image.get_width(), image.get_height())
                  if largest_dimension > THUMB_MAX_PIXELS:
                      var factor := float(THUMB_MAX_PIXELS) / float(largest_dimension)
                      image.resize(
                          maxi(1, int(round(image.get_width() * factor))),
                          maxi(1, int(round(image.get_height() * factor))),
                          Image.INTERPOLATE_LANCZOS
                      )
              return ImageTexture.create_from_image(image)

          func _exit_tree() -> void:
              if scan_thread != null and scan_thread.is_started():
                  scan_thread.wait_to_finish()
          EOF

          # Yalnizca Meta Quest Touch denetleyicisi icin kucuk ve acik bir
          # OpenXR eylem haritasi. Varsayilan, cok aygitli haritaya guvenilmez.
          cat > StereoViewer/openxr_action_map.tres <<'EOF'
          [gd_resource type="OpenXRActionMap" format=3]

          [sub_resource type="OpenXRAction" id="ActionDefaultPose"]
          resource_name = "default_pose"
          localized_name = "Default pose"
          action_type = 3
          toplevel_paths = PackedStringArray("/user/hand/left", "/user/hand/right")

          [sub_resource type="OpenXRAction" id="ActionA"]
          resource_name = "ax_button"
          localized_name = "A button"
          action_type = 0
          toplevel_paths = PackedStringArray("/user/hand/right")

          [sub_resource type="OpenXRAction" id="ActionB"]
          resource_name = "by_button"
          localized_name = "B button"
          action_type = 0
          toplevel_paths = PackedStringArray("/user/hand/right")

          [sub_resource type="OpenXRAction" id="ActionStick"]
          resource_name = "primary"
          localized_name = "Right thumbstick"
          action_type = 2
          toplevel_paths = PackedStringArray("/user/hand/right")

          [sub_resource type="OpenXRAction" id="ActionGrip"]
          resource_name = "grip"
          localized_name = "Right grip"
          action_type = 1
          toplevel_paths = PackedStringArray("/user/hand/right")

          [sub_resource type="OpenXRActionSet" id="ActionSetViewer"]
          resource_name = "viewer"
          localized_name = "StereoViewer controls"
          priority = 0
          actions = [SubResource("ActionDefaultPose"), SubResource("ActionA"), SubResource("ActionB"), SubResource("ActionStick"), SubResource("ActionGrip")]

          [sub_resource type="OpenXRIPBinding" id="BindingPoseLeft"]
          action = SubResource("ActionDefaultPose")
          binding_path = "/user/hand/left/input/aim/pose"

          [sub_resource type="OpenXRIPBinding" id="BindingPoseRight"]
          action = SubResource("ActionDefaultPose")
          binding_path = "/user/hand/right/input/aim/pose"

          [sub_resource type="OpenXRIPBinding" id="BindingA"]
          action = SubResource("ActionA")
          binding_path = "/user/hand/right/input/a/click"

          [sub_resource type="OpenXRIPBinding" id="BindingB"]
          action = SubResource("ActionB")
          binding_path = "/user/hand/right/input/b/click"

          [sub_resource type="OpenXRIPBinding" id="BindingStick"]
          action = SubResource("ActionStick")
          binding_path = "/user/hand/right/input/thumbstick"

          [sub_resource type="OpenXRIPBinding" id="BindingGrip"]
          action = SubResource("ActionGrip")
          binding_path = "/user/hand/right/input/squeeze/value"

          [sub_resource type="OpenXRInteractionProfile" id="ProfileTouch"]
          interaction_profile_path = "/interaction_profiles/oculus/touch_controller"
          bindings = [SubResource("BindingPoseLeft"), SubResource("BindingPoseRight"), SubResource("BindingA"), SubResource("BindingB"), SubResource("BindingStick"), SubResource("BindingGrip")]

          [resource]
          action_sets = [SubResource("ActionSetViewer")]
          interaction_profiles = [SubResource("ProfileTouch")]
          EOF

          test -s StereoViewer/project.godot
          test -s StereoViewer/Main.tscn
          test -s StereoViewer/viewer.gd
          test -s StereoViewer/openxr_action_map.tres
          test -s StereoViewer/stereo.gdshader
          test -s StereoViewer/thumbnail.gdshader
          if grep -Eq \
            'content://|finishAffinity|recreate|OS\.shell_open' \
            StereoViewer/viewer.gd; then
            echo "HATA: XR oturumunu bozan eski Android secici veya yeniden baslatma kodu bulundu."
            exit 1
          fi
          grep -Fq 'res://viewer.gd' StereoViewer/Main.tscn
          grep -Fq 'v0.5.3 - build 26' StereoViewer/viewer.gd
          grep -Fq 'OS.request_permission(permission)' StereoViewer/viewer.gd
          grep -Fq 'OS.SYSTEM_DIR_PICTURES' StereoViewer/viewer.gd
          grep -Fq 'OS.SYSTEM_DIR_DCIM' StereoViewer/viewer.gd
          grep -Fq 'OS.SYSTEM_DIR_DOWNLOADS' StereoViewer/viewer.gd
          grep -Fq 'scan_thread.start(_scan_library_worker)' StereoViewer/viewer.gd
          grep -Fq 'process_one_thumbnail()' StereoViewer/viewer.gd
          grep -Fq 'Border3' StereoViewer/Main.tscn
          grep -Fq 'ViewMode.PHOTO' StereoViewer/viewer.gd
          grep -Fq 'swap_eyes = not swap_eyes' StereoViewer/viewer.gd
          grep -Fq 'right_controller.get_float(&"grip")' StereoViewer/viewer.gd
          grep -Fq 'controller_delta.dot(grip_drag_axis)' StereoViewer/viewer.gd
          grep -Fq '/user/hand/right/input/squeeze/value' \
            StereoViewer/openxr_action_map.tres
          grep -Fq 'interaction_profiles/oculus/touch_controller' \
            StereoViewer/openxr_action_map.tres

      - name: Godot 4.6 ve Android export template dosyalarini kur
        shell: bash
        run: |
          mkdir -p "$HOME/godot-bin"
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d "$HOME/godot-bin"
          chmod +x "$HOME/godot-bin/Godot_v4.6-stable_linux.x86_64"

          curl -fL --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q -o /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.6.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.6.stable/android_source.zip"

      - name: Quest OpenXR Vendors eklentisini kur
        shell: bash
        run: |
          curl -fL --retry 3 \
            -o /tmp/openxr-vendors.zip \
            https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godotopenxrvendorsaddon.zip
          rm -rf /tmp/openxr-vendors
          mkdir -p /tmp/openxr-vendors
          unzip -q -o /tmp/openxr-vendors.zip -d /tmp/openxr-vendors

          ADDON_DIR="$(find /tmp/openxr-vendors -type d -path '*/addons/godotopenxrvendors' | head -n 1)"
          test -n "$ADDON_DIR"
          mkdir -p StereoViewer/addons
          cp -a "$ADDON_DIR" StereoViewer/addons/
          test -f StereoViewer/addons/godotopenxrvendors/plugin.gdextension
          test -f StereoViewer/addons/godotopenxrvendors/.bin/android/debug/godotopenxr-meta-debug.aar
          test -f StereoViewer/addons/godotopenxrvendors/.bin/android/release/godotopenxr-meta-release.aar

      - name: Android Gradle build template kur
        shell: bash
        run: |
          mkdir -p StereoViewer/android/build
          unzip -q -o \
            "$HOME/.local/share/godot/export_templates/4.6.stable/android_source.zip" \
            -d StereoViewer/android/build
          printf '4.6.stable\n' > StereoViewer/android/.build_version
          touch StereoViewer/android/.gdignore
          test -f StereoViewer/android/build/build.gradle

