name: StereoViewer Quest APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Bos proje klasorunu hazirla
        shell: bash
        run: |
          rm -rf StereoViewer
          mkdir -p StereoViewer/build

      - name: StereoViewer v0.3.0 tam proje kaynaklarini yaz
        shell: bash
        run: |
          cat > StereoViewer/project.godot <<'EOF'
          [application]
          config/name="StereoViewer"
          config/description="Meta Quest icin SBS 3B fotograf goruntuleyici"
          config/version="0.3.0"
          config/icon="res://icon.svg"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.4", "GL Compatibility")

          [display]
          window/size/viewport_width=1832
          window/size/viewport_height=1920
          window/handheld/orientation=0

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/vram_compression/import_etc2_astc=true
          xr/openxr/enabled=true

          [xr]
          openxr/enabled=true
          EOF

          cat > StereoViewer/icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#10182f"/>
                <stop offset="1" stop-color="#3567d6"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="104" fill="url(#bg)"/>
            <path d="M84 256c44-72 101-108 172-108s128 36 172 108c-44 72-101 108-172 108S128 328 84 256Z" fill="none" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
            <circle cx="256" cy="256" r="68" fill="#57d9ff"/>
            <circle cx="256" cy="256" r="28" fill="#10182f"/>
          </svg>
          EOF

          cat > StereoViewer/stereo.gdshader <<'EOF'
          shader_type spatial;
          render_mode unshaded, cull_disabled;

          uniform sampler2D stereo_photo : source_color;
          uniform bool swap_eyes = false;

          void fragment() {
              float eye = float(VIEW_INDEX);
              if (swap_eyes) {
                  eye = 1.0 - eye;
              }
              vec2 stereo_uv = vec2(UV.x * 0.5 + eye * 0.5, UV.y);
              ALBEDO = texture(stereo_photo, stereo_uv).rgb;
          }
          EOF

          cat > StereoViewer/Main.tscn <<'EOF'
          [gd_scene load_steps=7 format=3]

          [ext_resource path="res://main.gd" type="Script" id="1"]
          [ext_resource path="res://stereo.gdshader" type="Shader" id="2"]

          [sub_resource type="ShaderMaterial" id="StereoMaterial"]
          shader = ExtResource("2")

          [sub_resource type="QuadMesh" id="PhotoMesh"]
          material = SubResource("StereoMaterial")
          size = Vector2(3.2, 1.8)

          [sub_resource type="StandardMaterial3D" id="PanelMaterial"]
          shading_mode = 0
          albedo_color = Color(0.025, 0.04, 0.085, 0.98)

          [sub_resource type="QuadMesh" id="PanelMesh"]
          material = SubResource("PanelMaterial")
          size = Vector2(2.6, 1.35)

          [sub_resource type="Environment" id="Environment"]
          background_mode = 1
          background_color = Color(0.008, 0.012, 0.025, 1)
          ambient_light_source = 3
          ambient_light_color = Color(0.15, 0.18, 0.28, 1)
          ambient_light_energy = 0.35

          [node name="Main" type="Node3D"]
          script = ExtResource("1")

          [node name="WorldEnvironment" type="WorldEnvironment" parent="."]
          environment = SubResource("Environment")

          [node name="XROrigin3D" type="XROrigin3D" parent="."]

          [node name="XRCamera3D" type="XRCamera3D" parent="XROrigin3D"]

          [node name="Display" type="Node3D" parent="XROrigin3D"]
          position = Vector3(0, 1.55, -2.4)

          [node name="Photo" type="MeshInstance3D" parent="XROrigin3D/Display"]
          visible = false
          mesh = SubResource("PhotoMesh")

          [node name="InfoPanel" type="Node3D" parent="XROrigin3D/Display"]

          [node name="Background" type="MeshInstance3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0, -0.015)
          mesh = SubResource("PanelMesh")

          [node name="Title" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0.37, 0)
          pixel_size = 0.0025
          font_size = 46
          outline_size = 7
          text = "StereoViewer"

          [node name="Message" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0.03, 0)
          pixel_size = 0.0025
          font_size = 30
          outline_size = 6
          text = "A düğmesine basarak\nbir SBS fotoğraf seçin."

          [node name="Help" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, -0.43, 0)
          pixel_size = 0.0025
          font_size = 22
          outline_size = 5
          modulate = Color(0.62, 0.82, 1, 1)
          text = "A: Fotoğraf seç"

          [node name="PhotoStatus" type="Label3D" parent="XROrigin3D/Display"]
          visible = false
          position = Vector3(0, -1.02, 0.02)
          pixel_size = 0.0022
          font_size = 22
          outline_size = 6
          modulate = Color(0.82, 0.9, 1, 1)
          text = "A: Başka fotoğraf   X: Gözleri değiştir   Sağ çubuk: Mesafe"

          [node name="LeftController" type="XRController3D" parent="XROrigin3D"]
          tracker = &"left_hand"

          [node name="RightController" type="XRController3D" parent="XROrigin3D"]
          tracker = &"right_hand"

          [node name="FallbackCamera" type="Camera3D" parent="."]
          current = false
          EOF

          cat > StereoViewer/main.gd <<'EOF'
          extends Node3D

          const MIN_DISTANCE := 1.4
          const MAX_DISTANCE := 5.0
          const DISTANCE_SPEED := 1.35

          @onready var xr_origin: XROrigin3D = $XROrigin3D
          @onready var xr_camera: XRCamera3D = $XROrigin3D/XRCamera3D
          @onready var display: Node3D = $XROrigin3D/Display
          @onready var photo: MeshInstance3D = $XROrigin3D/Display/Photo
          @onready var info_panel: Node3D = $XROrigin3D/Display/InfoPanel
          @onready var message: Label3D = $XROrigin3D/Display/InfoPanel/Message
          @onready var help: Label3D = $XROrigin3D/Display/InfoPanel/Help
          @onready var photo_status: Label3D = $XROrigin3D/Display/PhotoStatus
          @onready var left_controller: XRController3D = $XROrigin3D/LeftController
          @onready var right_controller: XRController3D = $XROrigin3D/RightController

          var current_texture: ImageTexture
          var current_name := ""
          var swapped := false
          var viewing_distance := 2.4
          var picker_open := false

          func _ready() -> void:
              start_xr()
              left_controller.button_pressed.connect(_on_left_button_pressed)
              right_controller.button_pressed.connect(_on_right_button_pressed)
              await get_tree().process_frame
              await get_tree().process_frame
              recenter_display()
              show_welcome()

          func start_xr() -> void:
              var xr := XRServer.find_interface("OpenXR")
              if xr == null or not xr.is_initialized():
                  $FallbackCamera.current = true
                  message.text = "OpenXR başlatılamadı."
                  help.text = "Uygulamayı Quest içinde yeniden başlatın."
                  return
              get_viewport().use_xr = true
              DisplayServer.window_set_vsync_mode(DisplayServer.VSYNC_DISABLED)

          func show_welcome() -> void:
              photo.visible = false
              photo_status.visible = false
              info_panel.visible = true
              message.text = "A düğmesine basarak\nbir SBS fotoğraf seçin."
              help.text = "A: Fotoğraf seç"

          func open_photo_picker() -> void:
              if picker_open:
                  return
              if not DisplayServer.has_feature(DisplayServer.FEATURE_NATIVE_DIALOG_FILE):
                  show_error("Sistem dosya seçicisi açılamadı.")
                  return
              picker_open = true
              message.text = "Fotoğraf seçici açılıyor..."
              help.text = "Bir JPG, PNG veya WEBP dosyası seçin."
              var filters := PackedStringArray([
                  "*.jpg,*.jpeg,*.png,*.webp;Fotoğraflar;image/jpeg,image/png,image/webp"
              ])
              var result := DisplayServer.file_dialog_show(
                  "SBS fotoğraf seç",
                  "",
                  "",
                  false,
                  DisplayServer.FILE_DIALOG_MODE_OPEN_FILE,
                  filters,
                  _on_photo_selected
              )
              if result != OK:
                  picker_open = false
                  show_error("Fotoğraf seçici başlatılamadı.")

          func _on_photo_selected(status: bool, paths: PackedStringArray, _filter_index: int) -> void:
              picker_open = false
              if not status or paths.is_empty():
                  if current_texture == null:
                      show_welcome()
                  return
              load_photo_from_uri(paths[0])

          func load_photo_from_uri(uri: String) -> void:
              var file := FileAccess.open(uri, FileAccess.READ)
              if file == null:
                  show_error("Seçilen fotoğraf okunamadı.")
                  return
              var bytes := file.get_buffer(file.get_length())
              file.close()
              if bytes.is_empty():
                  show_error("Seçilen fotoğraf boş veya erişilemiyor.")
                  return

              var image := Image.new()
              var error := image.load_jpg_from_buffer(bytes)
              if error != OK:
                  error = image.load_png_from_buffer(bytes)
              if error != OK:
                  error = image.load_webp_from_buffer(bytes)
              if error != OK or image.is_empty():
                  show_error("Bu fotoğraf biçimi açılamadı.\nJPG, PNG veya WEBP seçin.")
                  return

              current_texture = ImageTexture.create_from_image(image)
              current_name = uri.get_file().uri_decode()
              var material := photo.get_active_material(0) as ShaderMaterial
              material.set_shader_parameter("stereo_photo", current_texture)
              material.set_shader_parameter("swap_eyes", swapped)

              var eye_aspect := (float(image.get_width()) * 0.5) / float(image.get_height())
              var height := 1.8
              var width := height * eye_aspect
              photo.mesh.size = Vector2(width, height)
              viewing_distance = 2.4
              recenter_display()
              info_panel.visible = false
              photo.visible = true
              photo_status.visible = true
              update_status()

          func show_error(text: String) -> void:
              photo.visible = false
              photo_status.visible = false
              info_panel.visible = true
              message.text = text
              help.text = "A: Yeniden fotoğraf seç"

          func recenter_display() -> void:
              var camera_transform := xr_camera.transform
              var forward := -camera_transform.basis.z
              forward.y = 0.0
              if forward.length_squared() < 0.001:
                  forward = Vector3.FORWARD
              forward = forward.normalized()
              display.position = camera_transform.origin + forward * viewing_distance
              display.position.y = camera_transform.origin.y
              display.look_at(camera_transform.origin, Vector3.UP, true)

          func _process(delta: float) -> void:
              if current_texture == null or picker_open:
                  return
              var stick := right_controller.get_vector2("primary")
              if abs(stick.y) > 0.15:
                  viewing_distance = clampf(
                      viewing_distance - stick.y * DISTANCE_SPEED * delta,
                      MIN_DISTANCE,
                      MAX_DISTANCE
                  )
                  recenter_display()
                  update_status()

          func update_status() -> void:
              photo_status.text = "A: Başka fotoğraf   X: Gözleri değiştir   Sağ çubuk: Mesafe   %.1f m" % viewing_distance

          func _on_right_button_pressed(button_name: String) -> void:
              if button_name in ["ax_button", "trigger_click"]:
                  open_photo_picker()

          func _on_left_button_pressed(button_name: String) -> void:
              if button_name == "ax_button" and current_texture != null:
                  swapped = not swapped
                  var material := photo.get_active_material(0) as ShaderMaterial
                  material.set_shader_parameter("swap_eyes", swapped)
                  update_status()

          func _unhandled_input(event: InputEvent) -> void:
              if event.is_action_pressed("ui_accept"):
                  open_photo_picker()
              elif event.is_action_pressed("ui_cancel") and current_texture != null:
                  swapped = not swapped
                  var material := photo.get_active_material(0) as ShaderMaterial
                  material.set_shader_parameter("swap_eyes", swapped)
          EOF

          test -s StereoViewer/project.godot
          test -s StereoViewer/Main.tscn
          test -s StereoViewer/main.gd
          test -s StereoViewer/stereo.gdshader

      - name: Godot 4.4.1 ve Android export template dosyalarini kur
        shell: bash
        run: |
          mkdir -p "$HOME/godot-bin"
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d "$HOME/godot-bin"
          chmod +x "$HOME/godot-bin/Godot_v4.4.1-stable_linux.x86_64"

          curl -fL --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q -o /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"

      - name: Quest OpenXR Vendors eklentisini kur
        shell: bash
        run: |
          curl -fL --retry 3 \
            -o /tmp/openxr-vendors.zip \
            https://github.com/GodotVR/godot_openxr_vendors/releases/download/4.2.2-stable/godotopenxrvendorsaddon.zip
          rm -rf /tmp/openxr-vendors
          mkdir -p /tmp/openxr-vendors
          unzip -q -o /tmp/openxr-vendors.zip -d /tmp/openxr-vendors

          ADDON_DIR="$(find /tmp/openxr-vendors -type d -path '*/addons/godotopenxrvendors' | head -n 1)"
          test -n "$ADDON_DIR"
          mkdir -p StereoViewer/addons
          cp -a "$ADDON_DIR" StereoViewer/addons/
          find StereoViewer/addons/godotopenxrvendors \
            -mindepth 1 -maxdepth 1 -type d ! -name meta -exec rm -rf {} +
          test -f StereoViewer/addons/godotopenxrvendors/meta/plugin.gdextension

      - name: Android Gradle build template kur
        shell: bash
        run: |
          mkdir -p StereoViewer/android/build
          unzip -q -o \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip" \
            -d StereoViewer/android/build
          printf '4.4.1.stable\n' > StereoViewer/android/.build_version
          touch StereoViewer/android/.gdignore
          test -f StereoViewer/android/build/build.gradle

      - name: Kalici uygulama imzasini dogrula
        shell: bash
        run: |
          test -s StereoGuide/stereoguide-release.jks
          keytool -list \
            -keystore StereoGuide/stereoguide-release.jks \
            -storepass StereoGuide2026 \
            -alias stereoguide >/dev/null

      - name: Godot Android editor ayarlarini yaz
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          EOF

      - name: Tam Quest export presetini yaz
        shell: bash
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/StereoGuide/stereoguide-release.jks"
          cat > StereoViewer/export_presets.cfg <<EOF
          [preset.0]
          name="Quest APK"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/StereoViewer-Quest.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=3
          version/name="0.3.0"
          package/unique_name="com.stereoguide.viewer"
          package/name="StereoViewer"
          package/signed=true
          keystore/debug="${KEYSTORE_PATH}"
          keystore/debug_user="stereoguide"
          keystore/debug_password="StereoGuide2026"
          keystore/release="${KEYSTORE_PATH}"
          keystore/release_user="stereoguide"
          keystore/release_password="StereoGuide2026"
          permissions/read_external_storage=false
          permissions/write_external_storage=false
          permissions/custom_permissions=PackedStringArray()
          xr_features/xr_mode=1
          plugins/GodotOpenXRKHR=false
          plugins/GodotOpenXRLynx=false
          plugins/GodotOpenXRMeta=true
          plugins/GodotOpenXRPico=false
          xr_features/hand_tracking=0
          xr_features/passthrough=0
          screen/immersive_mode=true
          EOF

      - name: Projeyi ice aktar ve kaynaklari dogrula
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          GODOT="$HOME/godot-bin/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path StereoViewer --import --quit-after 25
          test -f StereoViewer/addons/godotopenxrvendors/meta/plugin.gdextension
          find StereoViewer/.godot/imported -name 'icon.svg-*.ctex' -print -quit | grep -q .

      - name: Quest APK olustur
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -o pipefail
          GODOT="$HOME/godot-bin/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" \
            --headless \
            --verbose \
            --path StereoViewer \
            --export-debug "Quest APK" \
            "$GITHUB_WORKSPACE/StereoViewer/build/StereoViewer-Quest.apk" \
            2>&1 | tee StereoViewer/build/export.log
          test -s StereoViewer/build/StereoViewer-Quest.apk

      - name: APK paketini imzayi ve Quest bilesenlerini dogrula
        shell: bash
        run: |
          set -euo pipefail
          APK="StereoViewer/build/StereoViewer-Quest.apk"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.1/apksigner"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/35.0.1/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            | tee StereoViewer/build/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            StereoViewer/build/signature.txt

          unzip -l "$APK" > StereoViewer/build/apk-contents.txt
          grep -Eiq 'lib/arm64-v8a/.*(openxr|godotopenxrmeta).*\.so' \
            StereoViewer/build/apk-contents.txt

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml \
            > StereoViewer/build/manifest.txt
          grep -q 'com.oculus.intent.category.VR' StereoViewer/build/manifest.txt
          grep -q 'StereoViewer' StereoViewer/build/manifest.txt

      - name: Hata gunlugunu yayinla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StereoViewer-export-error-log
          path: |
            StereoViewer/build/export.log
            StereoViewer/build/signature.txt
            StereoViewer/build/manifest.txt
          if-no-files-found: warn
          retention-days: 7

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: StereoViewer-Quest-v0.3.0-APK
          path: StereoViewer/build/StereoViewer-Quest.apk
          if-no-files-found: error
          retention-days: 30
