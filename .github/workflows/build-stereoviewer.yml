name: StereoViewer Quest APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Bos proje klasorunu hazirla
        shell: bash
        run: |
          rm -rf StereoViewer
          mkdir -p StereoViewer/build

      - name: StereoViewer v0.5.0 kararlilik testi kaynaklarini yaz
        shell: bash
        run: |
          cat > StereoViewer/project.godot <<'EOF'
          [application]
          config/name="StereoViewer"
          config/description="Meta Quest icin SBS 3B fotograf goruntuleyici"
          config/version="0.5.0"
          config/icon="res://icon.svg"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.6", "GL Compatibility")

          [display]
          window/size/viewport_width=1832
          window/size/viewport_height=1920
          window/handheld/orientation=0

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/vram_compression/import_etc2_astc=true
          anti_aliasing/quality/msaa_3d=0
          xr/openxr/enabled=true

          [xr]
          openxr/enabled=true
          EOF

          cat > StereoViewer/icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#10182f"/>
                <stop offset="1" stop-color="#3567d6"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="104" fill="url(#bg)"/>
            <path d="M84 256c44-72 101-108 172-108s128 36 172 108c-44 72-101 108-172 108S128 328 84 256Z" fill="none" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
            <circle cx="256" cy="256" r="68" fill="#57d9ff"/>
            <circle cx="256" cy="256" r="28" fill="#10182f"/>
          </svg>
          EOF

          cat > StereoViewer/stereo.gdshader <<'EOF'
          shader_type spatial;
          render_mode unshaded, cull_disabled;

          uniform sampler2D stereo_photo : source_color, repeat_disable, filter_linear;
          uniform bool swap_eyes = false;

          void fragment() {
              float eye = float(VIEW_INDEX);
              if (swap_eyes) {
                  eye = 1.0 - eye;
              }
              vec2 stereo_uv = vec2(UV.x * 0.5 + eye * 0.5, UV.y);
              ALBEDO = texture(stereo_photo, stereo_uv).rgb;
          }
          EOF

          cat > StereoViewer/thumbnail.gdshader <<'EOF'
          shader_type spatial;
          render_mode unshaded, cull_disabled;

          uniform sampler2D thumbnail_photo : source_color, repeat_disable, filter_linear;

          void fragment() {
              // Galeride her iki goze de SBS fotografin sol karesini goster.
              // Boylece kucuk onizleme tek, normal bir fotograf gibi gorunur.
              vec2 thumbnail_uv = vec2(UV.x * 0.5, UV.y);
              ALBEDO = texture(thumbnail_photo, thumbnail_uv).rgb;
          }
          EOF

          cat > StereoViewer/Main.tscn <<'EOF'
          [gd_scene load_steps=7 format=3]

          [ext_resource path="res://baseline.gd" type="Script" id="1"]
          [ext_resource path="res://stereo.gdshader" type="Shader" id="2"]

          [sub_resource type="ShaderMaterial" id="StereoMaterial"]
          shader = ExtResource("2")

          [sub_resource type="QuadMesh" id="PhotoMesh"]
          material = SubResource("StereoMaterial")
          size = Vector2(3.2, 1.8)

          [sub_resource type="StandardMaterial3D" id="PanelMaterial"]
          shading_mode = 0
          albedo_color = Color(0.025, 0.04, 0.085, 0.98)

          [sub_resource type="QuadMesh" id="PanelMesh"]
          material = SubResource("PanelMaterial")
          size = Vector2(2.6, 1.35)

          [sub_resource type="Environment" id="Environment"]
          background_mode = 1
          background_color = Color(0.008, 0.012, 0.025, 1)
          ambient_light_source = 3
          ambient_light_color = Color(0.15, 0.18, 0.28, 1)
          ambient_light_energy = 0.35

          [node name="Main" type="Node3D"]
          script = ExtResource("1")

          [node name="WorldEnvironment" type="WorldEnvironment" parent="."]
          environment = SubResource("Environment")

          [node name="XROrigin3D" type="XROrigin3D" parent="."]

          [node name="XRCamera3D" type="XRCamera3D" parent="XROrigin3D"]

          [node name="Display" type="Node3D" parent="XROrigin3D"]
          position = Vector3(0, 1.55, -2.4)

          [node name="Photo" type="MeshInstance3D" parent="XROrigin3D/Display"]
          visible = false
          mesh = SubResource("PhotoMesh")

          [node name="InfoPanel" type="Node3D" parent="XROrigin3D/Display"]

          [node name="Background" type="MeshInstance3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0, -0.015)
          mesh = SubResource("PanelMesh")

          [node name="Title" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0.37, 0)
          pixel_size = 0.0025
          font_size = 46
          outline_size = 7
          text = "StereoViewer"

          [node name="Message" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, 0.03, 0)
          pixel_size = 0.0025
          font_size = 30
          outline_size = 6
          text = "A düğmesine basarak\nbir SBS fotoğraf seçin."

          [node name="Help" type="Label3D" parent="XROrigin3D/Display/InfoPanel"]
          position = Vector3(0, -0.43, 0)
          pixel_size = 0.0025
          font_size = 22
          outline_size = 5
          modulate = Color(0.62, 0.82, 1, 1)
          text = "A: VR galerisini aç"

          [node name="Gallery" type="Node3D" parent="XROrigin3D/Display"]
          visible = false

          [node name="Background" type="MeshInstance3D" parent="XROrigin3D/Display/Gallery"]
          position = Vector3(0, 0, -0.03)
          scale = Vector3(1.65, 1.08, 1)
          mesh = SubResource("PanelMesh")

          [node name="Title" type="Label3D" parent="XROrigin3D/Display/Gallery"]
          position = Vector3(0, 0.53, 0)
          pixel_size = 0.0025
          font_size = 36
          outline_size = 7
          text = "Fotoğraf galerisi"

          [node name="Content" type="Node3D" parent="XROrigin3D/Display/Gallery"]

          [node name="Help" type="Label3D" parent="XROrigin3D/Display/Gallery"]
          position = Vector3(0, -0.55, 0)
          pixel_size = 0.0025
          font_size = 21
          outline_size = 5
          modulate = Color(0.62, 0.82, 1, 1)
          text = "Çubuk sağ/sol: seç     A: aç     B: geri"

          [node name="LeftController" type="XRController3D" parent="XROrigin3D"]
          tracker = &"left_hand"

          [node name="RightController" type="XRController3D" parent="XROrigin3D"]
          tracker = &"right_hand"

          [node name="FallbackCamera" type="Camera3D" parent="."]
          current = false
          EOF

          # v0.5.0 yalnizca goruntu ve kumanda kararliligini sinar. Bu aktif
          # kodda depolama, izin, galeri, Android Activity veya fotograf yoktur.
          cat > StereoViewer/baseline.gd <<'EOF'
          extends Node3D

          const BUILD_TEXT := "v0.5.0 - build 23"
          const MIN_DISTANCE := 0.85
          const MAX_DISTANCE := 4.50
          const DISTANCE_SPEED := 1.25
          const STICK_TRIGGER := 0.62
          const STICK_RELEASE := 0.24

          @onready var xr_camera: XRCamera3D = $XROrigin3D/XRCamera3D
          @onready var display: Node3D = $XROrigin3D/Display
          @onready var photo: MeshInstance3D = $XROrigin3D/Display/Photo
          @onready var info_panel: Node3D = $XROrigin3D/Display/InfoPanel
          @onready var title: Label3D = $XROrigin3D/Display/InfoPanel/Title
          @onready var message: Label3D = $XROrigin3D/Display/InfoPanel/Message
          @onready var help: Label3D = $XROrigin3D/Display/InfoPanel/Help
          @onready var right_controller: XRController3D = $XROrigin3D/RightController
          @onready var fallback_camera: Camera3D = $FallbackCamera

          var xr_ready := false
          var a_count := 0
          var b_count := 0
          var horizontal_count := 0
          var viewing_distance := 2.10
          var horizontal_latched := false
          var last_event := "Uygulama acildi"

          func _ready() -> void:
              process_mode = Node.PROCESS_MODE_ALWAYS
              photo.visible = false
              info_panel.visible = true
              title.text = "StereoViewer kararlilik testi"
              right_controller.button_pressed.connect(_on_right_button_pressed)
              attach_panel_to_camera()
              initialize_xr()
              update_panel()

          func initialize_xr() -> void:
              var xr_interface := XRServer.find_interface("OpenXR")
              if xr_interface != null and xr_interface.is_initialized():
                  DisplayServer.window_set_vsync_mode(DisplayServer.VSYNC_DISABLED)
                  get_viewport().use_xr = true
                  xr_ready = true
                  last_event = "OpenXR hazir"
                  return

              # Bu ekran yalnizca OpenXR baslatilamazsa masaustu penceresinde
              # gorunur. Quest'te normal yol yukaridaki hazir OpenXR oturumudur.
              fallback_camera.current = true
              xr_ready = false
              last_event = "OpenXR BASLATILAMADI"

          func attach_panel_to_camera() -> void:
              # Paneli dogrudan HMD kamerasina baglamak, tracking origin ve
              # yeniden merkezleme farklarindan bagimsiz olarak gorunmesini saglar.
              display.reparent(xr_camera, false)
              display.rotation = Vector3.ZERO
              update_panel_distance()

          func update_panel_distance() -> void:
              display.position = Vector3(0.0, 0.0, -viewing_distance)

          func _on_right_button_pressed(action_name: StringName) -> void:
              match action_name:
                  &"ax_button":
                      a_count += 1
                      last_event = "A algilandi"
                      update_panel()
                  &"by_button":
                      b_count += 1
                      last_event = "B algilandi"
                      update_panel()

          func _process(delta: float) -> void:
              if not xr_ready:
                  return

              var stick := right_controller.get_vector2(&"primary")

              if abs(stick.x) >= STICK_TRIGGER and not horizontal_latched:
                  horizontal_latched = true
                  horizontal_count += 1 if stick.x > 0.0 else -1
                  last_event = "Cubuk SAG" if stick.x > 0.0 else "Cubuk SOL"
                  update_panel()
              elif abs(stick.x) <= STICK_RELEASE:
                  horizontal_latched = false

              if abs(stick.y) > 0.20 and abs(stick.y) > abs(stick.x):
                  var old_distance := viewing_distance
                  viewing_distance = clampf(
                      viewing_distance - stick.y * DISTANCE_SPEED * delta,
                      MIN_DISTANCE,
                      MAX_DISTANCE
                  )
                  if not is_equal_approx(old_distance, viewing_distance):
                      update_panel_distance()
                      last_event = "Cubuk ILERI/GERI"
                      update_panel()

          func update_panel() -> void:
              message.text = (
                  BUILD_TEXT
                  + "\n\nA: " + str(a_count)
                  + "     B: " + str(b_count)
                  + "\nSag/sol: " + str(horizontal_count)
                  + "     Mesafe: " + str(snappedf(viewing_distance, 0.01))
                  + " m\n\nSon olay: " + last_event
              )
              help.text = "A ve B: sayac     Cubuk: sag/sol ve ileri/geri"
          EOF

          # Yalnizca Meta Quest Touch denetleyicisi icin kucuk ve acik bir
          # OpenXR eylem haritasi. Varsayilan, cok aygitli haritaya guvenilmez.
          cat > StereoViewer/openxr_action_map.tres <<'EOF'
          [gd_resource type="OpenXRActionMap" format=3]

          [sub_resource type="OpenXRAction" id="ActionDefaultPose"]
          resource_name = "default_pose"
          localized_name = "Default pose"
          action_type = 3
          toplevel_paths = PackedStringArray("/user/hand/left", "/user/hand/right")

          [sub_resource type="OpenXRAction" id="ActionA"]
          resource_name = "ax_button"
          localized_name = "A button"
          action_type = 0
          toplevel_paths = PackedStringArray("/user/hand/right")

          [sub_resource type="OpenXRAction" id="ActionB"]
          resource_name = "by_button"
          localized_name = "B button"
          action_type = 0
          toplevel_paths = PackedStringArray("/user/hand/right")

          [sub_resource type="OpenXRAction" id="ActionStick"]
          resource_name = "primary"
          localized_name = "Right thumbstick"
          action_type = 2
          toplevel_paths = PackedStringArray("/user/hand/right")

          [sub_resource type="OpenXRActionSet" id="ActionSetViewer"]
          resource_name = "viewer"
          localized_name = "StereoViewer controls"
          priority = 0
          actions = [SubResource("ActionDefaultPose"), SubResource("ActionA"), SubResource("ActionB"), SubResource("ActionStick")]

          [sub_resource type="OpenXRIPBinding" id="BindingPoseLeft"]
          action = SubResource("ActionDefaultPose")
          binding_path = "/user/hand/left/input/aim/pose"

          [sub_resource type="OpenXRIPBinding" id="BindingPoseRight"]
          action = SubResource("ActionDefaultPose")
          binding_path = "/user/hand/right/input/aim/pose"

          [sub_resource type="OpenXRIPBinding" id="BindingA"]
          action = SubResource("ActionA")
          binding_path = "/user/hand/right/input/a/click"

          [sub_resource type="OpenXRIPBinding" id="BindingB"]
          action = SubResource("ActionB")
          binding_path = "/user/hand/right/input/b/click"

          [sub_resource type="OpenXRIPBinding" id="BindingStick"]
          action = SubResource("ActionStick")
          binding_path = "/user/hand/right/input/thumbstick"

          [sub_resource type="OpenXRInteractionProfile" id="ProfileTouch"]
          interaction_profile_path = "/interaction_profiles/oculus/touch_controller"
          bindings = [SubResource("BindingPoseLeft"), SubResource("BindingPoseRight"), SubResource("BindingA"), SubResource("BindingB"), SubResource("BindingStick")]

          [resource]
          action_sets = [SubResource("ActionSetViewer")]
          interaction_profiles = [SubResource("ProfileTouch")]
          EOF

          test -s StereoViewer/project.godot
          test -s StereoViewer/Main.tscn
          test -s StereoViewer/baseline.gd
          test -s StereoViewer/openxr_action_map.tres
          test -s StereoViewer/stereo.gdshader
          test -s StereoViewer/thumbnail.gdshader
          if grep -Eq \
            'request_permission|DirAccess|FileAccess|gallery|activity|content://' \
            StereoViewer/baseline.gd; then
            echo "HATA: Kararlilik testine fotograf veya Android kodu karismis."
            exit 1
          fi
          grep -Fq 'res://baseline.gd' StereoViewer/Main.tscn
          grep -Fq 'v0.5.0 - build 23' StereoViewer/baseline.gd
          grep -Fq 'interaction_profiles/oculus/touch_controller' \
            StereoViewer/openxr_action_map.tres

      - name: Godot 4.6 ve Android export template dosyalarini kur
        shell: bash
        run: |
          mkdir -p "$HOME/godot-bin"
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d "$HOME/godot-bin"
          chmod +x "$HOME/godot-bin/Godot_v4.6-stable_linux.x86_64"

          curl -fL --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q -o /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.6.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.6.stable/android_source.zip"

      - name: Quest OpenXR Vendors eklentisini kur
        shell: bash
        run: |
          curl -fL --retry 3 \
            -o /tmp/openxr-vendors.zip \
            https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godotopenxrvendorsaddon.zip
          rm -rf /tmp/openxr-vendors
          mkdir -p /tmp/openxr-vendors
          unzip -q -o /tmp/openxr-vendors.zip -d /tmp/openxr-vendors

          ADDON_DIR="$(find /tmp/openxr-vendors -type d -path '*/addons/godotopenxrvendors' | head -n 1)"
          test -n "$ADDON_DIR"
          mkdir -p StereoViewer/addons
          cp -a "$ADDON_DIR" StereoViewer/addons/
          test -f StereoViewer/addons/godotopenxrvendors/plugin.gdextension
          test -f StereoViewer/addons/godotopenxrvendors/.bin/android/debug/godotopenxr-meta-debug.aar
          test -f StereoViewer/addons/godotopenxrvendors/.bin/android/release/godotopenxr-meta-release.aar

      - name: Android Gradle build template kur
        shell: bash
        run: |
          mkdir -p StereoViewer/android/build
          unzip -q -o \
            "$HOME/.local/share/godot/export_templates/4.6.stable/android_source.zip" \
            -d StereoViewer/android/build
          printf '4.6.stable\n' > StereoViewer/android/.build_version
          touch StereoViewer/android/.gdignore
          test -f StereoViewer/android/build/build.gradle

      - name: Kalici uygulama imzasini yaz ve dogrula
        shell: bash
        run: |
          mkdir -p StereoViewer/signing
          cat > /tmp/stereoviewer-keystore.b64 <<'EOF'
          
          EOF
          base64 --decode /tmp/stereoviewer-keystore.b64 \
            > StereoViewer/signing/stereoviewer-release.jks
          test -s StereoViewer/signing/stereoviewer-release.jks
          keytool -list \
            -keystore StereoViewer/signing/stereoviewer-release.jks \
            -storepass StereoGuide2026 \
            -alias stereoguide >/dev/null

      - name: Tam Quest export presetini yaz
        shell: bash
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/StereoViewer/signing/stereoviewer-release.jks"
          cat > StereoViewer/export_presets.cfg <<EOF
          [preset.0]
          name="Quest APK"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/StereoViewer-Quest.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=23
          version/name="0.5.0"
          package/unique_name="com.stereoguide.viewer"
          package/name="StereoViewer"
          package/signed=true
          package/app_category=2
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          keystore/debug="${KEYSTORE_PATH}"
          keystore/debug_user="stereoguide"
          keystore/debug_password="StereoGuide2026"
          keystore/release="${KEYSTORE_PATH}"
          keystore/release_user="stereoguide"
          keystore/release_password="StereoGuide2026"
          permissions/read_external_storage=false
          permissions/read_media_images=false
          permissions/write_external_storage=false
          permissions/custom_permissions=PackedStringArray()
          xr_features/xr_mode=1
          plugins/GodotOpenXRKHR=false
          plugins/GodotOpenXRLynx=false
          plugins/GodotOpenXRMeta=true
          plugins/GodotOpenXRPico=false
          xr_features/hand_tracking=0
          xr_features/hand_tracking_frequency=0
          xr_features/passthrough=0
          xr_features/enable_meta_plugin=true
          xr_features/enable_pico_plugin=false
          xr_features/enable_lynx_plugin=false
          xr_features/enable_khr_plugin=false
          xr_features/enable_khronos_plugin=false
          meta_xr_features/hand_tracking=0
          meta_xr_features/hand_tracking_frequency=0
          meta_xr_features/passthrough=0
          meta_xr_features/eye_tracking=0
          meta_xr_features/quest_1_support=false
          meta_xr_features/quest_2_support=true
          meta_xr_features/quest_3_support=true
          meta_xr_features/quest_pro_support=true
          meta_xr_features/supported_devices="quest2|questpro|quest3|quest3s"
          meta_xr_features/use_anchor_api=false
          meta_xr_features/use_scene_api=false
          screen/immersive_mode=true
          EOF

      - name: Projeyi ice aktar ve kaynaklari dogrula
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          GODOT="$HOME/godot-bin/Godot_v4.6-stable_linux.x86_64"
          rm -f "$HOME/.config/godot/editor_settings-4.tres"
          "$GODOT" --headless --path StereoViewer --import --quit-after 60
          test -f StereoViewer/addons/godotopenxrvendors/plugin.gdextension
          test -f StereoViewer/addons/godotopenxrvendors/.bin/android/debug/godotopenxr-meta-debug.aar
          find StereoViewer/.godot/imported -name 'icon.svg-*.ctex' -print -quit | grep -q .

      - name: Quest APK olustur
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -o pipefail
          GODOT="$HOME/godot-bin/Godot_v4.6-stable_linux.x86_64"
          "$GODOT" \
            --headless \
            --verbose \
            --path StereoViewer \
            --export-debug "Quest APK" \
            "$GITHUB_WORKSPACE/StereoViewer/build/StereoViewer-Quest.apk" \
            2>&1 | tee StereoViewer/build/export.log
          test -s StereoViewer/build/StereoViewer-Quest.apk

      - name: APK paketini ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          APK="StereoViewer/build/StereoViewer-Quest.apk"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.1/apksigner"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/35.0.1/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            | tee StereoViewer/build/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            StereoViewer/build/signature.txt

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml \
            > StereoViewer/build/manifest.txt
          "$AAPT" dump badging "$APK" \
            > StereoViewer/build/badging.txt

          require_text() {
            local pattern="$1"
            local file="$2"
            local description="$3"
            if ! grep -Fq "$pattern" "$file"; then
              echo "HATA: $description bulunamadi."
              echo "Aranan ifade: $pattern"
              echo "Denetlenen dosya: $file"
              exit 1
            fi
            echo "TAMAM: $description"
          }

          require_text \
            "package: name='com.stereoguide.viewer'" \
            StereoViewer/build/badging.txt \
            'dogru Android paket adi'
          require_text \
            "application-label:'StereoViewer'" \
            StereoViewer/build/badging.txt \
            'StereoViewer uygulama adi'
          require_text \
            "versionCode='23'" \
            StereoViewer/build/badging.txt \
            'v0.5.0 Android surum kodu'
          require_text \
            "versionName='0.5.0'" \
            StereoViewer/build/badging.txt \
            'v0.5.0 Android surum adi'
          require_text \
            "com.oculus.intent.category.VR" \
            StereoViewer/build/manifest.txt \
            'Quest VR uygulama kategorisi'

          require_text \
            "org.godotengine.plugin.v2.GodotOpenXR" \
            StereoViewer/build/manifest.txt \
            'Godot Meta OpenXR eklenti kaydi'

          unzip -Z1 "$APK" > StereoViewer/build/apk-files.txt
          if ! grep -Fxq 'lib/arm64-v8a/libopenxr_loader.so' \
            StereoViewer/build/apk-files.txt; then
            echo "HATA: ARM64 OpenXR yukleyici kutuphanesi APK icinde bulunamadi."
            grep -E '(^|/)(libopenxr|libgodotopenxr)' \
              StereoViewer/build/apk-files.txt || true
            exit 1
          fi
          echo "TAMAM: ARM64 OpenXR yukleyici kutuphanesi APK icinde bulundu."

          unzip -p "$APK" 'classes*.dex' \
            | strings > StereoViewer/build/dex-strings.txt
          if ! grep -Fq 'org/godotengine/openxr/vendors/GodotOpenXR' \
            StereoViewer/build/dex-strings.txt; then
            echo "HATA: Godot Meta OpenXR Java eklentisi APK icinde bulunamadi."
            exit 1
          fi
          echo "TAMAM: Godot Meta OpenXR Java eklentisi APK icinde bulundu."

          echo "APK imzasi, Quest VR yapisi, paket adi ve uygulama adi basariyla dogrulandi."

      - name: Hata gunlugunu yayinla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StereoViewer-export-error-log
          path: |
            StereoViewer/build/export.log
            StereoViewer/build/signature.txt
            StereoViewer/build/manifest.txt
            StereoViewer/build/badging.txt
            StereoViewer/build/apk-files.txt
          if-no-files-found: warn
          retention-days: 7

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: StereoViewer-Quest-v0.5.0-APK
          path: StereoViewer/build/StereoViewer-Quest.apk
          if-no-files-found: error
          retention-days: 30
