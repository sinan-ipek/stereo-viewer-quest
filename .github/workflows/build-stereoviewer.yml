name: StereoViewer Quest APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Projeyi ZIP dosyasindan ac
        shell: bash
        run: |
          rm -rf StereoViewer
          unzip -q -o StereoViewer-Quest-v0.1.0-project.zip
          test -f StereoViewer/project.godot

      - name: Godot 4.3 ve Android export template dosyalarini kur
        shell: bash
        run: |
          mkdir -p "$HOME/godot-bin"
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d "$HOME/godot-bin"
          chmod +x "$HOME/godot-bin/Godot_v4.3-stable_linux.x86_64"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

          curl -fL --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q -o /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip"

      - name: Quest OpenXR Vendors eklentisini kur
        shell: bash
        run: |
          RELEASE_JSON=/tmp/openxr-release.json
          curl -fL --retry 3 \
            -o "$RELEASE_JSON" \
            https://api.github.com/repos/GodotVR/godot_openxr_vendors/releases/tags/3.0.1-stable

          PLUGIN_URL="$(python3 -c 'import json; d=json.load(open("/tmp/openxr-release.json")); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].lower().endswith(".zip") and "symbol" not in a["name"].lower() and "sample" not in a["name"].lower()))')"
          test -n "$PLUGIN_URL"
          curl -fL --retry 3 -o /tmp/openxr-vendors.zip "$PLUGIN_URL"
          rm -rf /tmp/openxr-vendors
          mkdir -p /tmp/openxr-vendors
          unzip -q -o /tmp/openxr-vendors.zip -d /tmp/openxr-vendors

          ADDON_DIR="$(find /tmp/openxr-vendors -type d -path '*/addons/godotopenxrvendors' | head -n 1)"
          test -n "$ADDON_DIR"
          mkdir -p StereoViewer/addons
          cp -a "$ADDON_DIR" StereoViewer/addons/
          test -d StereoViewer/addons/godotopenxrvendors

      - name: Android Gradle build template kur
        shell: bash
        run: |
          rm -rf StereoViewer/android/build
          mkdir -p StereoViewer/android/build
          unzip -q -o \
            "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip" \
            -d StereoViewer/android/build
          test -f StereoViewer/android/build/build.gradle

      - name: Debug imza anahtarini hazirla
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Godot Android editor ayarlarini yaz
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Tam Quest export presetini yaz
        shell: bash
        run: |
          cat > StereoViewer/export_presets.cfg <<EOF
          [preset.0]
          name="Quest APK"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/StereoViewer-Quest.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="0.1.0"
          package/unique_name="com.stereoguide.viewer"
          package/name="StereoViewer"
          package/signed=true
          keystore/debug="${HOME}/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          permissions/read_external_storage=true
          permissions/write_external_storage=false
          permissions/custom_permissions=PackedStringArray("android.permission.READ_MEDIA_IMAGES")
          xr_features/xr_mode=1
          xr_features/hand_tracking=0
          xr_features/hand_tracking_frequency=0
          xr_features/hand_tracking_version=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          EOF

      - name: Projeyi ice aktar ve eklentiyi dogrula
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          GODOT="$HOME/godot-bin/Godot_v4.3-stable_linux.x86_64"
          "$GODOT" --headless --editor --path StereoViewer --import --quit-after 20
          test -d StereoViewer/addons/godotopenxrvendors

      - name: Quest APK olustur
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p StereoViewer/build
          GODOT="$HOME/godot-bin/Godot_v4.3-stable_linux.x86_64"
          "$GODOT" \
            --headless \
            --verbose \
            --path StereoViewer \
            --export-debug "Quest APK" \
            "$GITHUB_WORKSPACE/StereoViewer/build/StereoViewer-Quest.apk"
          test -s StereoViewer/build/StereoViewer-Quest.apk

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: StereoViewer-Quest-v0.1.0-APK
          path: StereoViewer/build/StereoViewer-Quest.apk
          if-no-files-found: error
          retention-days: 30
