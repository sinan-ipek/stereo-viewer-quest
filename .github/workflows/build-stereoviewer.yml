name: StereoViewer Quest APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android araclarini kur
        uses: android-actions/setup-android@v3

      - name: Gerekli Android paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Proje ZIP dosyasini ac
        shell: bash
        run: |
          rm -rf StereoViewer
          unzip -o StereoViewer-Quest-v0.1.0-project.zip
          test -f StereoViewer/project.godot

      - name: Tam Quest export presetini yaz
        shell: bash
        run: |
          cat > StereoViewer/export_presets.cfg <<'EOF'
          [preset.0]
          name="Quest APK"
          platform="Android"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/StereoViewer-Quest.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="0.1.0"
          package/unique_name="com.stereoguide.viewer"
          package/name="StereoViewer"
          package/signed=true
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          permissions/read_external_storage=true
          permissions/write_external_storage=false
          permissions/custom_permissions=PackedStringArray("android.permission.READ_MEDIA_IMAGES")
          xr_features/xr_mode=1
          xr_features/hand_tracking=0
          xr_features/hand_tracking_frequency=0
          xr_features/hand_tracking_version=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          EOF
          grep -q 'package/signed=true' StereoViewer/export_presets.cfg
          grep -q 'keystore/debug=' StereoViewer/export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=true' StereoViewer/export_presets.cfg

      - name: Godot ve export template dosyalarini indir
        id: godot_prepare
        continue-on-error: true
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./StereoViewer
          archive_output: false
          cache: true

      - name: Godot ve Android yollarini bul
        id: paths
        shell: bash
        run: |
          GODOT_BIN="$(find "$HOME/.local/share/godot/godot_executable" -type f -name 'Godot*' -perm -111 | head -n 1)"
          JAVA_SDK="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -x "$GODOT_BIN"
          test -d "$JAVA_SDK"
          test -d "$ANDROID_SDK"
          echo "godot_bin=$GODOT_BIN" >> "$GITHUB_OUTPUT"
          echo "java_sdk=$JAVA_SDK" >> "$GITHUB_OUTPUT"
          echo "android_sdk=$ANDROID_SDK" >> "$GITHUB_OUTPUT"

      - name: Debug imza anahtarini hazirla
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Godot Android editor ayarlarini yaz
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "${{ steps.paths.outputs.android_sdk }}"
          export/android/java_sdk_path = "${{ steps.paths.outputs.java_sdk }}"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Android Gradle build template kur
        shell: bash
        run: |
          TEMPLATE_ZIP="$(find "$HOME/.local/share/godot/export_templates" -type f -name android_source.zip | head -n 1)"
          test -n "$TEMPLATE_ZIP"
          rm -rf StereoViewer/android/build
          mkdir -p StereoViewer/android/build
          unzip -q -o "$TEMPLATE_ZIP" -d StereoViewer/android/build
          test -f StereoViewer/android/build/build.gradle

      - name: Quest APK olustur
        shell: bash
        env:
          ANDROID_HOME: ${{ steps.paths.outputs.android_sdk }}
          ANDROID_SDK_ROOT: ${{ steps.paths.outputs.android_sdk }}
          JAVA_HOME: ${{ steps.paths.outputs.java_sdk }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p StereoViewer/build
          "${{ steps.paths.outputs.godot_bin }}" \
            --headless \
            --verbose \
            --path StereoViewer \
            --export-debug "Quest APK" \
            "${{ github.workspace }}/StereoViewer/build/StereoViewer-Quest.apk"
          test -s StereoViewer/build/StereoViewer-Quest.apk

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: StereoViewer-Quest-v0.1.0-APK
          path: StereoViewer/build/StereoViewer-Quest.apk
          if-no-files-found: error
          retention-days: 30
